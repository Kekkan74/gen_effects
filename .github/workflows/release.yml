name: Build & Release GenEffects

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_game:
    name: Export Standalone Binaries
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates & Cache
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/4.3.stable
          mv /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true

      - name: Build Windows Standalone Executable
        run: |
          mkdir -v -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/GenEffects.exe
          cd build/windows && zip -r ../../GenEffects_Windows_x64.zip . && cd ../..

      - name: Build Linux Standalone Executable
        run: |
          mkdir -v -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/GenEffects.x86_64
          cd build/linux && zip -r ../../GenEffects_Linux_x64.zip . && cd ../..

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            GenEffects_Windows_x64.zip
            GenEffects_Linux_x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
